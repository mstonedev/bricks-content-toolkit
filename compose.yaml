services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    working_dir: /workspaces/my-plugin
    volumes:
      - .:/workspaces/bricks-content-toolkit:cached
      - plugin_node_modules:/workspaces/bricks-content-toolkit/node_modules
    command: sleep infinity
    depends_on:
      mariadb:
        condition: service_healthy

  wordpress:
    image: wordpress:php${PHP_VERSION:-8.3}-apache
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MARIADB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: "1"
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/bricks-content-toolkit:cached
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-wordpress}
      MARIADB_USER: ${MARIADB_USER:-wordpress}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-db-password}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  wordpress_data:
  mariadb_data:
  plugin_node_modules: